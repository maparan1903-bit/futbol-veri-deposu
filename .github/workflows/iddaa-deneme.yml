name: iddaa erişim denemesi

# One-off reachability probe: can GitHub's servers read the public iddaa pre-match bulletin? Nothing is committed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deneme:
    runs-on: ubuntu-latest
    steps:
      - name: Bülteni dene
        run: |
          set -u
          code=$(curl -s -o /tmp/b.json -w '%{http_code}' --max-time 60 \
            -H 'User-Agent: football-intelligence/0.1 (personal research)' \
            'https://sportsbookv2.iddaa.com/sportsbook/events?st=1&type=0&version=0') || true
          echo "HTTP $code, $(wc -c < /tmp/b.json) bayt"
          head -c 300 /tmp/b.json; echo
          python3 -c "import json;d=json.load(open('/tmp/b.json'));print('isSuccess',d.get('isSuccess'),'events',len(d.get('data',{}).get('events',[])))" || true
